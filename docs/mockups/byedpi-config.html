<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ByeDPI — sade yapılandırma</title>
<style>
:root{color-scheme:dark;--bg:#111517;--panel:#1a1f22;--field:#151a1d;--line:#303a3f;--text:#eef2f3;--muted:#a8b2b8;--accent:#24b59d}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#253033 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,system-ui,sans-serif}.dialog{width:min(520px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px #0009;overflow:hidden}.content{padding:24px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.02em}.close{color:var(--muted);font-size:22px;line-height:1}.field{display:grid;gap:7px;margin-top:14px}label,.label{color:var(--muted);font-size:12px}.control{min-height:40px;border:1px solid var(--line);border-radius:9px;background:var(--field);padding:9px 12px;color:var(--text);display:flex;align-items:center;justify-content:space-between}.chevron{color:var(--muted);font-size:11px}details{margin-top:22px;border-top:1px solid var(--line);padding-top:16px}summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px;font-weight:600}summary::-webkit-details-marker{display:none}summary::before{content:'›';color:var(--muted);font-size:18px;transform:rotate(90deg);transition:.15s}details:not([open]) summary::before{transform:rotate(0)}.optional{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}.help{margin:6px 0 14px 28px;color:var(--muted);font-size:12px}textarea{width:100%;min-height:76px;resize:none;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:10px 12px;color:var(--text);font:inherit}.hint{margin-top:6px;color:var(--muted);font-size:12px}.scan{margin-top:12px;min-height:36px;border:1px solid var(--line);border-radius:8px;padding:0 13px;background:transparent;color:var(--text);font:inherit}.results{display:grid;gap:7px;margin-top:16px}.result{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:9px;background:var(--field)}.radio{width:16px;height:16px;border:1px solid var(--muted);border-radius:50%}.selected{border-color:var(--accent);box-shadow:inset 0 0 0 4px var(--field),inset 0 0 0 7px var(--accent)}.score{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}footer{display:flex;justify-content:flex-end;gap:9px;padding:16px 24px;border-top:1px solid var(--line)}button{min-height:36px;border-radius:8px;padding:0 14px;font:inherit}.ghost{color:var(--muted);background:transparent;border:1px solid var(--line)}.primary{color:#06221d;font-weight:650;background:var(--accent);border:1px solid var(--accent)}
</style></head><body>
<main class="dialog"><div class="content"><header><h1>ByeDPI yapılandırması</h1><span class="close">×</span></header><div class="field"><label>Strateji</label><div class="control">Standart <span class="chevron">▼</span></div></div><div class="field"><label>DNS · isteğe bağlı</label><div class="control" style="color:var(--muted)">Varsayılan DNS</div></div><details open><summary>GoodCheck <span class="optional">İsteğe bağlı</span></summary><p class="help">Ağında çalışan stratejiyi bul. Sonuç seçilmeden ayarlar değişmez.</p><div class="label">Test edilecek alan adları</div><textarea>discord.com&#10;youtube.com&#10;pornhub.com</textarea><div class="hint">Her satıra bir alan adı · en fazla 8 alan adı</div><button class="scan">GoodCheck ile tara</button><div class="results"><div class="result"><span class="radio"></span><span>Standart</span><span class="score">3 / 3</span></div><div class="result"><span class="radio"></span><span>TLS record</span><span class="score">3 / 3</span></div><div class="result"><span class="radio selected"></span><span>Split</span><span class="score">3 / 3</span></div></div></details></div><footer><button class="ghost">Vazgeç</button><button class="primary">Kaydet</button></footer></main>
</body></html>
