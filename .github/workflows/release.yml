name: Signed release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: dtolnay/rust-toolchain@stable
      - name: Import signing certificate
        shell: pwsh
        env:
          PFX_BASE64: ${{ secrets.RELEASE_PFX_BASE64 }}
          PFX_PASSWORD: ${{ secrets.RELEASE_PFX_PASSWORD }}
        run: |
          if (!$env:PFX_BASE64 -or !$env:PFX_PASSWORD) { throw 'Signing material is required.' }
          $pfx = Join-Path $env:RUNNER_TEMP 'release.pfx'
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:PFX_BASE64))
            Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force) | Out-Null
          } finally { Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue }
      - name: Build and sign
        shell: pwsh
        env:
          THUMBPRINT: ${{ secrets.RELEASE_CERT_THUMBPRINT }}
          PUBLISHER: ${{ vars.RELEASE_CERT_SUBJECT }}
        run: |
          if (!$env:THUMBPRINT -or !$env:PUBLISHER) { throw 'Certificate thumbprint and publisher are required.' }
          ./scripts/build-release.ps1 -CertificateThumbprint $env:THUMBPRINT -ExpectedPublisher $env:PUBLISHER
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPrism-signed-win-x64
          path: |
            artifacts/OpenPrism-win-x64.zip
            artifacts/OpenPrism-win-x64.zip.sha256
          if-no-files-found: error
